<!-- Pagina Inicio de Sesion -->
<!doctype html>
<html lang="es">
  <head>
    <!-- Required meta tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <!--FontAwesome CDN-->
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.15.2/css/all.css"
      integrity="sha384-vSIIfh2YWi9wW0r9iZe7RJPrKwp6bG+s9QZMoITbCckVJqGCCRhc+ccxNcdpHuYu"
      crossorigin="anonymous"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap"
      rel="stylesheet"
    />

    <!--Custome CSS-->
    <link rel="stylesheet" href="css/animaciones.css" />
    <link rel="stylesheet" href="css/estilos.css" />

    <!--Title-->
    <title>Inicio de Sesión</title>

    <!--Icon-->
    <link rel="icon" type="image/x-icon" href="/Icons/LogoIcon.ico" />
  </head>
  <body class="bg-light prevent-select">
    <!------------------------------- Encabezado ------------------------------------>
    <nav class="static navbar navbar-expand-lg EncaGen">
      <a href="/dashboard.html"><img
        src="/img/VoltavaLogo0.png"
        width="250"
        height="50"
        class="logo-bounce"
      /></a>
      <h1 class="tit">Sistema de Credenciales</h1>
    </nav>

    <!------------------------------- Contenido principal ------------------------------------>
    <main class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
          <div class="card shadow-lg border-0 fade-in">
            <div class="card-header EncaGen text-white text-center py-3">
              <h2 class="h4 mb-0">Iniciar Sesión</h2>
            </div>
            <div class="card-body p-4">
              <form id="loginForm">
                <div class="mb-3">
                  <label for="usuario" class="form-label">
                    <i class="bi bi-person-fill me-1"></i> Usuario
                  </label>
                  <input
                    type="text"
                    class="form-control form-control-lg"
                    id="usuario"
                    required
                    autofocus
                  />
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">
                    <i class="bi bi-lock-fill me-1"></i> Contraseña
                  </label>
                  <input
                    type="password"
                    class="form-control form-control-lg"
                    id="password"
                    required
                  />
                </div>
                <div class="cent d-grid gap-2 col-md-12 mt-4">
                  <button type="submit" class="btn btn-primary btn-lg">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="text-center mt-5 py-3 text-muted">
      <div class="container">
        <p>Sistema de Credenciales &copy; 2025</p>
      </div>
    </footer>

    <!--------------------------- Error modal ---------------------------->
    <div class="modal fade" id="errorModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-danger text-white">
            <h5 class="modal-title">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>Error
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body" id="errorMessage">
            Error al iniciar sesión
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cerrar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- JavaScript and Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/utilidades/api.js"></script>
    <script src="js/login.js"></script>

  </body>
</html>
