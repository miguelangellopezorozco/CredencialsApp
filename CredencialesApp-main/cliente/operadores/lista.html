<!-- Pagina Lista Usuarios -->
<!doctype html>
<html lang="es">
  <head>
    <!-- Required meta tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <!--FontAwesome CDN-->
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.15.2/css/all.css"
      integrity="sha384-vSIIfh2YWi9wW0r9iZe7RJPrKwp6bG+s9QZMoITbCckVJqGCCRhc+ccxNcdpHuYu"
      crossorigin="anonymous"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap"
      rel="stylesheet"
    />

    <!--Custome CSS-->
    <link rel="stylesheet" href="../css/animaciones.css" />
    <link rel="stylesheet" href="../css/estilos.css" />

    <!--Title-->
    <title>Lista Usuarios</title>

    <!--Icon-->
    <link rel="icon" type="image/x-icon" href="/Icons/LogoIcon.ico" />
  </head>
  <body class="bg-light prevent-select">
    <!------------------------------- Encabezado ------------------------------------>
    <nav class="static navbar navbar-expand-lg EncaGen">
      <a href="/dashboard.html"
        ><img
          src="/img/VoltavaLogo0.png"
          width="250"
          height="50"
          class="logo-bounce"
      /></a>
      <h1 class="tit">Sistema de Credenciales</h1>
      <div class="dropdown">
        <button
          class="btn btn-success dropdown-toggle"
          type="button"
          id="userDropdown"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          <i class="bi bi-person-circle me-1"></i>
          <span id="nombreUsuario">Usuario</span>
        </button>
        <ul
          class="dropdown-menu dropdown-menu-end"
          aria-labelledby="userDropdown"
        >
          <li>
            <button class="dropdown-item" id="btnLogout">
              <i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión
            </button>
          </li>
        </ul>
      </div>
    </nav>

    <!------------------------------- Barra de Navegacion ------------------------------------>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
      <div class="container">
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarMain"
          aria-controls="navbarMain"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="../credenciales/lista.html"
                ><i class="bi bi-person me-1"></i>Personal</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../plantillas/lista.html"
                ><i class="bi bi-person-vcard me-1"></i>Credenciales</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../credenciales/editor.html"
                ><i class="bi bi-printer me-1"></i>Impresion</a
              >
            </li>
            <li class="nav-item" id="menuOperadores" style="display: none">
              <a class="nav-link" href="lista.html"
                ><i class="bi bi-people me-1"></i> Usuarios</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Contenido principal -->
    <main class="container py-4 fade-in">
      <div class="row mb-4">
        <div class="col-12">
          <div class="d-flex justify-content-between align-items-center">
            <h2 class="mb-0">
              <i class="bi bi-layout-text-window me-2"></i>Cuentas de Usuarios
            </h2>
            <a href="crear.html" class="btn btn-primary">
              <i class="bi bi-plus-circle me-1"></i> Nuevo Usuario
            </a>
          </div>
          <hr />
        </div>
      </div>

      <!-- Lista de Usuarios -->
      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col">
          <div class="card h-100 shadow-sm hover-card">
            <div class="card-header bg-light">
              <h5 class="mb-0">Usuarios Existentes</h5>
            </div>
            <div class="card-body text-center">
              <div class="mb-3">
                <img
                  src="../img/placeholder-template.png"
                  alt="Vista previa"
                  class="img-fluid border"
                  style="max-height: 120px"
                />
              </div>
              <p class="card-text text-muted small">Plantilla Usuarios</p>
            </div>
            <div class="card-footer d-flex justify-content-between">
              <button class="btn btn-sm btn-outline-primary">
                <i class="bi bi-pencil me-1"></i> Editar
              </button>
              <button class="btn btn-sm btn-outline-danger">
                <i class="bi bi-trash me-1"></i> Eliminar
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white py-3 mt-auto border-top">
      <div class="container">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <span class="text-muted">Sistema de Credenciales &copy; 2025</span>
          </div>
          <div>
            <span class="text-muted">Versión 1.1</span>
          </div>
        </div>
      </div>
    </footer>

    <!-- JavaScript and Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/utilidades/api.js"></script>
    <script src="../js/operadores/lista.js"></script>

    <script>
      // Script básico para verificar sesión
      document.addEventListener("DOMContentLoaded", () => {
        const nombreUsuario = document.getElementById("nombreUsuario");
        const btnLogout = document.getElementById("btnLogout");
        const menuOperadores = document.getElementById("menuOperadores");

        // Verificar sesión
        api
          .verificarSesion()
          .then((response) => {
            if (!response.autenticado) {
              window.location.href = "/index.html";
              return;
            }

            nombreUsuario.textContent = response.operador.usuario;

            // 🔒 BLOQUEO TOTAL SI NO ES ADMIN
            if (response.operador.rol !== "admin") {
              window.location.href = "/dashboard.html";
              return;
            }

            // Si es admin mostrar menú
            menuOperadores.style.display = "block";
          })
          .catch((error) => {
            console.error("Error al verificar sesión:", error);
            window.location.href = "/index.html";
          });

        // Logout
        btnLogout.addEventListener("click", async () => {
          try {
            await api.logout();
            window.location.href = "/index.html";
          } catch (error) {
            console.error("Error al cerrar sesión:", error);
          }
        });
      });
    </script>
  </body>
</html>
